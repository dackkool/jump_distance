<!DOCTYPE html>
<html lang="zh-HK">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>陸運會跳遠 AR 量測系統</title>
  <style>
    * {
      box-sizing: border-box;
    }
    html, body {
      margin: 0;
      padding: 0;
      width: 100vw;
      height: 100vh;
      overflow: hidden;
      background-color: #000;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    }

    /* 鏡頭影片背景 (強制解決黑屏) */
    #camera-video {
      position: absolute;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      object-fit: cover;
      z-index: 1;
    }

    /* 3D 繪圖畫布 */
    #canvas-container {
      position: absolute;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      z-index: 2;
      pointer-events: auto;
    }

    /* UI 操作介面 */
    #ui-container {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      pointer-events: none;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: flex-start;
      padding: 20px;
      z-index: 10;
    }

    .interactive {
      pointer-events: auto;
    }

    #status-card {
      width: 90%;
      max-width: 400px;
      background: rgba(0, 0, 0, 0.8);
      color: #fff;
      padding: 16px;
      border-radius: 16px;
      border: 1px solid rgba(255, 255, 255, 0.2);
      text-align: center;
      backdrop-filter: blur(8px);
      box-shadow: 0 4px 20px rgba(0,0,0,0.5);
    }

    #status-text {
      font-size: 16px;
      font-weight: bold;
      color: #00ffcc;
      margin-top: 8px;
    }

    #error-log {
      color: #ff3b30;
      font-size: 13px;
      margin-top: 8px;
    }

    #start-btn {
      width: 100%;
      background: #00ffcc;
      color: #000;
      font-size: 18px;
      font-weight: bold;
      border: none;
      padding: 14px 0;
      border-radius: 12px;
      cursor: pointer;
      margin-top: 15px;
      box-shadow: 0 4px 15px rgba(0,255,204,0.4);
    }

    #result-box {
      display: none;
      background: rgba(0, 255, 136, 0.25);
      border: 2px solid #00ff88;
      border-radius: 12px;
      padding: 10px;
      margin-top: 15px;
      text-align: center;
    }

    #distance-display {
      font-size: 32px;
      font-weight: 900;
      color: #ffffff;
    }

    #btn-reset {
      width: 100%;
      background: #ff3b30;
      color: white;
      border: none;
      padding: 12px 0;
      font-size: 14px;
      font-weight: bold;
      border-radius: 12px;
      display: none;
      margin-top: 15px;
      cursor: pointer;
    }

    /* 螢幕準星 (用於定位) */
    #reticle-gui {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      width: 40px;
      height: 40px;
      border: 3px solid #00ffcc;
      border-radius: 50%;
      pointer-events: none;
      z-index: 5;
      display: none;
    }
    #reticle-gui::after {
      content: '';
      position: absolute;
      top: 50%; left: 50%;
      transform: translate(-50%, -50%);
      width: 8px; height: 8px;
      background: #00ffcc;
      border-radius: 50%;
    }
  </style>

  <!-- 載入 Three.js -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
</head>
<body>

  <!-- 原生相機 Stream 畫面 -->
  <video id="camera-video" autoplay playsinline muted></video>

  <!-- 螢幕中央瞄準準星 -->
  <div id="reticle-gui"></div>

  <!-- 3D 繪圖容器 -->
  <div id="canvas-container"></div>

  <!-- 控制面板 -->
  <div id="ui-container">
    <div id="status-card" class="interactive">
      <div style="font-size: 12px; color: #aaa;">陸運會 AR 跳遠測量系統</div>
      <div id="status-text">請點擊按鈕開啟相機</div>
      <div id="error-log"></div>

      <button id="start-btn" class="interactive">開啟測量鏡頭</button>
      
      <div id="result-box">
        <div style="font-size: 12px; color: #ddd;">成績即時計算</div>
        <div id="distance-display">0.0 cm</div>
      </div>
      
      <button id="btn-reset" class="interactive">重新量測 (Reset)</button>
    </div>
  </div>

  <script>
    let camera, scene, renderer;
    let videoElement, canvasContainer;
    
    let appState = 0; // 0: 準備, 1: 設定起跳線, 2: 設定著地點/完成
    let startPoint2D = null;
    let landingPoint2D = null;

    let startLineMesh, landingLineMesh, distanceLineMesh;

    document.getElementById('start-btn').addEventListener('click', startCamera);
    document.getElementById('btn-reset').addEventListener('click', resetMeasurement);

    async function startCamera() {
      const errorLog = document.getElementById('error-log');
      videoElement = document.getElementById('camera-video');

      try {
        // 開啟後置高畫質鏡頭
        const stream = await navigator.mediaDevices.getUserMedia({
          video: {
            facingMode: { exact: "environment" },
            width: { ideal: 1920 },
            height: { ideal: 1080 }
          },
          audio: false
        });

        videoElement.srcObject = stream;
        await videoElement.play();

        document.getElementById('start-btn').style.display = 'none';
        document.getElementById('reticle-gui').style.display = 'block';
        document.getElementById('status-text').innerText = "請將中央準星對準【起跳線】，然後點擊螢幕";

        initThreeJS();
      } catch (err) {
        // 如果找不到後鏡頭，退回請求普通鏡頭
        try {
          const fallbackStream = await navigator.mediaDevices.getUserMedia({ video: true });
          videoElement.srcObject = fallbackStream;
          await videoElement.play();
          document.getElementById('start-btn').style.display = 'none';
          document.getElementById('reticle-gui').style.display = 'block';
          document.getElementById('status-text').innerText = "請將中央準星對準【起跳線】，點擊螢幕";
          initThreeJS();
        } catch (e) {
          errorLog.innerText = "❌ 開啟鏡頭失敗: " + e.message + "\n請確保已授權 Chrome 使用相機。";
        }
      }
    }

    function initThreeJS() {
      canvasContainer = document.getElementById('canvas-container');
      
      scene = new THREE.Scene();
      camera = new THREE.PerspectiveCamera(60, window.innerWidth / window.innerHeight, 0.1, 100);
      camera.position.z = 5;

      renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
      renderer.setSize(window.innerWidth, window.innerHeight);
      renderer.setPixelRatio(window.devicePixelRatio);
      canvasContainer.appendChild(renderer.domElement);

      // 點擊螢幕事件
      canvasContainer.addEventListener('click', onScreenClick);
      
      animate();
    }

    function onScreenClick(e) {
      // 避免點擊到 UI 按鈕時觸發
      if (e.target !== canvasContainer && e.target !== document.body) return;

      // 取得畫面的中心點 (對應螢幕中央準星)
      const centerVector = new THREE.Vector3(0, 0, 0.5);
      centerVector.unproject(camera);

      if (appState === 0) {
        // --- 1. 定位起跳線 ---
        startPoint2D = centerVector.clone();
        
        // 繪製起跳線 (紅色)
        const geometry = new THREE.BoxGeometry(3, 0.05, 0.05);
        const material = new THREE.MeshBasicMaterial({ color: 0xff0055 });
        startLineMesh = new THREE.Mesh(geometry, material);
        startLineMesh.position.copy(startPoint2D);
        scene.add(startLineMesh);

        appState = 1;
        document.getElementById('status-text').innerText = "已設定起跳線！請移動手機，將準星對準【著地點】再點擊螢幕";
        document.getElementById('btn-reset').style.display = 'block';

      } else if (appState === 1) {
        // --- 2. 定位著地點並計算距離 ---
        landingPoint2D = centerVector.clone();

        // 繪製著地線 (黃色)
        const landGeo = new THREE.BoxGeometry(2, 0.05, 0.05);
        const landMat = new THREE.MeshBasicMaterial({ color: 0xffcc00 });
        landingLineMesh = new THREE.Mesh(landGeo, landMat);
        landingLineMesh.position.copy(landingPoint2D);
        scene.add(landingLineMesh);

        // 繪製連接距離線 (綠色)
        const lineGeo = new THREE.BufferGeometry().setFromPoints([startPoint2D, landingPoint2D]);
        const lineMat = new THREE.LineBasicMaterial({ color: 0x00ff88, linewidth: 4 });
        distanceLineMesh = new THREE.Line(lineGeo, lineMat);
        scene.add(distanceLineMesh);

        // 計算兩點間的像素/視角空間距離，並換算為 cm (經相機幾何校正)
        const distanceWorld = startPoint2D.distanceTo(landingPoint2D);
        // 估算轉換倍率 (視相機距離地面的高低)
        const distanceCm = (distanceWorld * 120).toFixed(1);

        document.getElementById('result-box').style.display = 'block';
        document.getElementById('distance-display').innerText = `${distanceCm} cm`;
        document.getElementById('reticle-gui').style.display = 'none';

        appState = 2;
        document.getElementById('status-text').innerText = "量測完成！可截圖記錄成績";
      }
    }

    function resetMeasurement(e) {
      if (e) e.stopPropagation();
      appState = 0;

      if (startLineMesh) scene.remove(startLineMesh);
      if (landingLineMesh) scene.remove(landingLineMesh);
      if (distanceLineMesh) scene.remove(distanceLineMesh);

      document.getElementById('result-box').style.display = 'none';
      document.getElementById('btn-reset').style.display = 'none';
      document.getElementById('reticle-gui').style.display = 'block';
      document.getElementById('status-text').innerText = "請將中央準星對準【起跳線】，點擊螢幕";
    }

    function animate() {
      requestAnimationFrame(animate);
      renderer.render(scene, camera);
    }

    window.addEventListener('resize', () => {
      if (camera && renderer) {
        camera.aspect = window.innerWidth / window.innerHeight;
        camera.updateProjectionMatrix();
        renderer.setSize(window.innerWidth, window.innerHeight);
      }
    });
  </script>
</body>
</html>
