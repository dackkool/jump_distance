<!DOCTYPE html>
<html lang="zh-HK">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>陸運會跳遠 AI 測量系統 (橫屏專用)</title>
  <style>
    * { box-sizing: border-box; }
    html, body {
      margin: 0; padding: 0;
      width: 100vw; height: 100vh;
      overflow: hidden; background-color: #000;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    }

    #video-feed {
      position: absolute; top: 0; left: 0;
      width: 100vw; height: 100vh;
      object-fit: cover; z-index: 1;
    }

    #draw-canvas {
      position: absolute; top: 0; left: 0;
      width: 100vw; height: 100vh;
      z-index: 2; pointer-events: none;
    }

    #ui-container {
      position: fixed; top: 0; left: 0;
      width: 100%; height: 100%;
      pointer-events: none; z-index: 10;
      display: flex; flex-direction: column;
      justify-content: space-between; padding: 15px 25px;
    }

    .interactive { pointer-events: auto; }

    #top-bar {
      display: flex; justify-content: space-between; align-items: center;
      background: rgba(0, 0, 0, 0.8); color: #fff;
      padding: 10px 20px; border-radius: 30px;
      backdrop-filter: blur(8px); border: 1px solid rgba(255,255,255,0.2);
    }

    #status-text { font-size: 15px; font-weight: bold; color: #00ffcc; }
    #ai-state { font-size: 13px; color: #ffcc00; }

    #action-btn-container {
      position: absolute; right: 30px; top: 50%;
      transform: translateY(-50%); display: flex; flex-direction: column; gap: 15px;
    }

    .btn {
      background: #00ffcc; color: #000;
      font-size: 18px; font-weight: 900;
      border: none; padding: 16px 36px; border-radius: 40px;
      cursor: pointer; box-shadow: 0 4px 20px rgba(0,255,204,0.5);
      transition: all 0.2s;
    }
    .btn:active { transform: scale(0.95); }
    .btn-again { background: #ffcc00; color: #000; display: none; }

    /* 結果照片 Modal */
    #photo-modal {
      display: none; position: fixed; top: 0; left: 0;
      width: 100vw; height: 100vh; background: rgba(0,0,0,0.92);
      z-index: 100; flex-direction: column; align-items: center; justify-content: center;
      padding: 15px;
    }

    #captured-image {
      max-width: 90%; max-height: 75vh;
      border: 3px solid #00ffcc; border-radius: 12px;
      box-shadow: 0 0 30px rgba(0,255,204,0.3);
    }

    /* 如果手機依然直放的提示 */
    #orientation-warning {
      display: none;
      position: fixed; top: 0; left: 0; width: 100vw; height: 100vh;
      background: #111; color: #ffcc00; z-index: 999;
      flex-direction: column; align-items: center; justify-content: center;
      text-align: center; padding: 20px;
    }
  </style>

  <!-- Google MediaPipe Pose 庫 -->
  <script src="https://cdn.jsdelivr.net/npm/@mediapipe/camera_utils/camera_utils.js" crossorigin="anonymous"></script>
  <script src="https://cdn.jsdelivr.net/npm/@mediapipe/pose/pose.js" crossorigin="anonymous"></script>
</head>
<body>

  <!-- 直屏提醒視窗 -->
  <div id="orientation-warning">
    <div style="font-size: 48px; margin-bottom: 10px;">🔄</div>
    <h2>請開啟手機「自動旋轉」並橫放手機</h2>
    <p style="color: #aaa; font-size: 14px;">請由手機頂部下拉控制中心，關閉「鎖定方向」</p>
  </div>

  <!-- 相機串流 -->
  <video id="video-feed" playsinline muted></video>
  <!-- 繪圖層 -->
  <canvas id="draw-canvas"></canvas>

  <!-- UI 介面 -->
  <div id="ui-container">
    <div id="top-bar">
      <div>
        <span style="font-size: 11px; color: #aaa;">陸運會跳遠 AI 自動測量系統</span>
        <div id="status-text">請將【綠虛線】對準地面起跳線，點擊 Ready 鎖定</div>
      </div>
      <div id="ai-state">相機初始化中...</div>
    </div>

    <div id="action-btn-container" class="interactive">
      <button id="btn-ready" class="btn">Ready</button>
      <button id="btn-again" class="btn btn-again">Again</button>
    </div>
  </div>

  <!-- 照片導出 Modal -->
  <div id="photo-modal">
    <h3 style="color: #00ffcc; margin: 0 0 10px 0;">📸 已記錄落地瞬間！</h3>
    <img id="captured-image" src="" alt="跳遠紀錄">
    <button id="btn-modal-again" class="btn btn-again interactive" style="display: block; margin-top: 15px;">Again (測量下一位)</button>
  </div>

  <script>
    const videoElement = document.getElementById('video-feed');
    const canvasElement = document.getElementById('draw-canvas');
    const canvasCtx = canvasElement.getContext('2d');

    const btnReady = document.getElementById('btn-ready');
    const btnAgain = document.getElementById('btn-again');
    const btnModalAgain = document.getElementById('btn-modal-again');
    const statusText = document.getElementById('status-text');
    const aiState = document.getElementById('ai-state');
    const warningEl = document.getElementById('orientation-warning');

    let isReady = false;
    let isCaptured = false;
    let startLineXRatio = 0.35; // 橫屏畫面左側 35% 處

    let poseDetector = null;
    let lastFeetX = 0;
    let feetVelocity = 0;
    let personInAir = false;

    // 距離換算比例
    const CM_PER_PIXEL = 0.75;

    window.addEventListener('load', initApp);

    async function initApp() {
      checkOrientation();
      window.addEventListener('resize', () => {
        checkOrientation();
        resizeCanvas();
      });

      // 1. 初始化 AI 模型
      poseDetector = new Pose({
        locateFile: (file) => `https://cdn.jsdelivr.net/npm/@mediapipe/pose/${file}`
      });

      poseDetector.setOptions({
        modelComplexity: 1,
        smoothLandmarks: true,
        minDetectionConfidence: 0.7,
        minTrackingConfidence: 0.7
      });

      poseDetector.onResults(onPoseResults);

      // 2. 請求原生橫向 (16:9) 高畫質鏡頭
      try {
        const stream = await navigator.mediaDevices.getUserMedia({
          video: {
            facingMode: { exact: "environment" },
            width: { ideal: 1920 },
            height: { ideal: 1080 },
            aspectRatio: { ideal: 1.777777778 } // 強制 16:9 橫向比例
          },
          audio: false
        });

        videoElement.srcObject = stream;
        await videoElement.play();

        // 啟動 MediaPipe AI 分析
        const cameraProcess = async () => {
          if (isReady && !isCaptured && videoElement.readyState >= 2) {
            await poseDetector.send({ image: videoElement });
          }
          requestAnimationFrame(cameraProcess);
        };
        cameraProcess();

        aiState.innerText = "高清後置鏡頭就續";
      } catch (e) {
        aiState.innerText = "❌ 鏡頭錯誤: " + e.message;
      }

      btnReady.addEventListener('click', handleReady);
      btnAgain.addEventListener('click', handleAgain);
      btnModalAgain.addEventListener('click', handleAgain);

      resizeCanvas();
      requestAnimationFrame(renderLoop);
    }

    function checkOrientation() {
      if (window.innerHeight > window.innerWidth) {
        warningEl.style.display = 'flex';
      } else {
        warningEl.style.display = 'none';
      }
    }

    function resizeCanvas() {
      canvasElement.width = window.innerWidth;
      canvasElement.height = window.innerHeight;
    }

    function handleReady() {
      isReady = true;
      btnReady.style.display = 'none';
      btnAgain.style.display = 'block';

      statusText.innerText = "🔒 起跳線已鎖定！等待運動員起跳...";
      statusText.style.color = "#ff0055";
      aiState.innerText = "AI 正在監控中...";
    }

    function handleAgain() {
      isReady = false;
      isCaptured = false;
      personInAir = false;

      document.getElementById('photo-modal').style.display = 'none';
      btnReady.style.display = 'block';
      btnAgain.style.display = 'none';

      statusText.innerText = "請將【綠虛線】對準地面起跳線，點擊 Ready 鎖定";
      statusText.style.color = "#00ffcc";
      aiState.innerText = "請按 Ready 鎖定起跳線";

      requestAnimationFrame(renderLoop);
    }

    function renderLoop() {
      canvasCtx.clearRect(0, 0, canvasElement.width, canvasElement.height);

      const xPos = startLineXRatio * canvasElement.width;

      if (!isReady) {
        // 橫屏垂直綠色虛線
        canvasCtx.beginPath();
        canvasCtx.strokeStyle = "#00ffcc";
        canvasCtx.lineWidth = 5;
        canvasCtx.setLineDash([20, 12]);
        canvasCtx.moveTo(xPos, 0);
        canvasCtx.lineTo(xPos, canvasElement.height);
        canvasCtx.stroke();
        canvasCtx.setLineDash([]);
      } else if (!isCaptured) {
        // 紅色鎖定線
        canvasCtx.beginPath();
        canvasCtx.strokeStyle = "#ff0055";
        canvasCtx.lineWidth = 6;
        canvasCtx.moveTo(xPos, 0);
        canvasCtx.lineTo(xPos, canvasElement.height);
        canvasCtx.stroke();
      }

      if (!isCaptured) {
        requestAnimationFrame(renderLoop);
      }
    }

    function onPoseResults(results) {
      if (!isReady || isCaptured) return;

      if (results.poseLandmarks) {
        const landmarks = results.poseLandmarks;

        // 嚴格過濾非人體物件 (必須偵測到鼻子與腳跟)
        const nose = landmarks[0];
        const leftHeel = landmarks[29];
        const rightHeel = landmarks[30];

        const isHumanDetected = (nose.visibility > 0.6) && 
                                (leftHeel.visibility > 0.6 || rightHeel.visibility > 0.6);

        if (!isHumanDetected) return;

        aiState.innerText = "🏃 捕捉到運動員！";

        const heelX = Math.min(leftHeel.x, rightHeel.x);
        const heelY = leftHeel.x < rightHeel.x ? leftHeel.y : rightHeel.y;

        feetVelocity = Math.abs(heelX - lastFeetX);
        lastFeetX = heelX;

        if (heelX > startLineXRatio) {
          personInAir = true;
          aiState.innerText = "🏃 運動員躍入沙坑中...";
        }

        if (personInAir && feetVelocity < 0.002 && !isCaptured) {
          isCaptured = true;
          captureAndAnnotatePhoto(heelX, heelY);
        }
      }
    }

    function captureAndAnnotatePhoto(landingX, landingY) {
      statusText.innerText = "📸 成功捕捉落地瞬間！";
      aiState.innerText = "計算成績中...";

      const photoCanvas = document.createElement('canvas');
      photoCanvas.width = videoElement.videoWidth || 1920;
      photoCanvas.height = videoElement.videoHeight || 1080;
      const pCtx = photoCanvas.getContext('2d');

      pCtx.drawImage(videoElement, 0, 0, photoCanvas.width, photoCanvas.height);

      const startX = startLineXRatio * photoCanvas.width;
      const landX = landingX * photoCanvas.width;
      const landY = landingY * photoCanvas.height;

      const pixelDist = Math.abs(landX - startX);
      const distanceCm = (pixelDist * CM_PER_PIXEL).toFixed(1);

      // 起跳線
      pCtx.beginPath();
      pCtx.strokeStyle = "#ff0055";
      pCtx.lineWidth = 8;
      pCtx.moveTo(startX, 0);
      pCtx.lineTo(startX, photoCanvas.height);
      pCtx.stroke();

      // 著地線
      pCtx.beginPath();
      pCtx.strokeStyle = "#ffcc00";
      pCtx.lineWidth = 8;
      pCtx.moveTo(landX, 0);
      pCtx.lineTo(landX, photoCanvas.height);
      pCtx.stroke();

      // 距離線
      pCtx.beginPath();
      pCtx.strokeStyle = "#00ff88";
      pCtx.lineWidth = 6;
      pCtx.setLineDash([15, 10]);
      pCtx.moveTo(startX, landY);
      pCtx.lineTo(landX, landY);
      pCtx.stroke();

      // 成績標註
      pCtx.fillStyle = "#00ff88";
      pCtx.font = "bold 56px sans-serif";
      pCtx.shadowColor = "black";
      pCtx.shadowBlur = 12;
      pCtx.fillText(`${distanceCm} cm`, (startX + landX) / 2 - 80, landY - 20);

      document.getElementById('captured-image').src = photoCanvas.toDataURL('image/jpeg');
      document.getElementById('photo-modal').style.display = 'flex';
    }
  </script>
</body>
</html>
