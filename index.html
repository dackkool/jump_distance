<!DOCTYPE html>
<html lang="zh-HK">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>陸運會跳遠 AR 量測系統</title>
  <style>
    html, body {
      margin: 0;
      padding: 0;
      width: 100vw;
      height: 100vh;
      overflow: hidden;
      background: transparent !important;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    }

    #ui-container {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      pointer-events: none;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: flex-start;
      padding: 20px;
      box-sizing: border-box;
      z-index: 9999;
    }

    .interactive {
      pointer-events: auto;
    }

    #status-card {
      width: 90%;
      max-width: 400px;
      background: rgba(0, 0, 0, 0.85);
      color: #fff;
      padding: 20px;
      border-radius: 16px;
      border: 1px solid rgba(255, 255, 255, 0.2);
      text-align: center;
      backdrop-filter: blur(8px);
      box-shadow: 0 4px 20px rgba(0,0,0,0.5);
    }

    #status-text {
      font-size: 16px;
      font-weight: bold;
      color: #00ffcc;
      margin-top: 8px;
    }

    #error-log {
      color: #ff3b30;
      font-size: 13px;
      margin-top: 8px;
    }

    #start-ar-btn {
      width: 100%;
      background: #00ffcc;
      color: #000;
      font-size: 18px;
      font-weight: bold;
      border: none;
      padding: 14px 0;
      border-radius: 12px;
      cursor: pointer;
      margin-top: 15px;
      box-shadow: 0 4px 15px rgba(0,255,204,0.4);
      display: none; /* 初始化後會改為 block */
    }

    #result-box {
      display: none;
      background: rgba(0, 255, 136, 0.2);
      border: 2px solid #00ff88;
      border-radius: 12px;
      padding: 10px;
      margin-top: 15px;
      text-align: center;
    }

    #distance-display {
      font-size: 32px;
      font-weight: 900;
      color: #ffffff;
    }

    #btn-reset {
      width: 100%;
      background: #ff3b30;
      color: white;
      border: none;
      padding: 12px 0;
      font-size: 14px;
      font-weight: bold;
      border-radius: 12px;
      display: none;
      margin-top: 15px;
      cursor: pointer;
    }
  </style>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
</head>
<body>

  <div id="ui-container">
    <div id="status-card" class="interactive">
      <div style="font-size: 12px; color: #aaa;">陸運會 AR 跳遠測量系統</div>
      <div id="status-text">正在檢查裝置...</div>
      <div id="error-log"></div>

      <!-- 綠色按鈕直接放在面板內，避免層級覆蓋問題 -->
      <button id="start-ar-btn" class="interactive">點擊啟動 AR 鏡頭</button>
      
      <div id="result-box">
        <div style="font-size: 12px; color: #ddd;">成績即時計算</div>
        <div id="distance-display">0.0 cm</div>
      </div>
      
      <button id="btn-reset" class="interactive">重新量測 (Reset)</button>
    </div>
  </div>

  <script>
    let camera, scene, renderer;
    let controller;
    let reticle;
    let hitTestSource = null;
    let hitTestSourceRequested = false;

    let appState = 0; // 0: 找平面, 1: 定起跳線, 2: 完成
    let startLinePoint = null;
    let landingPoint = null;
    let startLineMesh, landingLineMesh, distanceLineMesh;

    initXRCheck();

    async function initXRCheck() {
      const errorLog = document.getElementById('error-log');
      
      if (!window.isSecureContext) {
        errorLog.innerText = "❌ 必須使用 HTTPS 開啟此網頁！";
        return;
      }

      if ('xr' in navigator) {
        try {
          const supported = await navigator.xr.isSessionSupported('immersive-ar');
          if (supported) {
            document.getElementById('status-text').innerText = "系統就緒！請點擊下方按鈕";
            const btn = document.getElementById('start-ar-btn');
            btn.style.display = 'block';
            btn.addEventListener('click', onStartARClick);
          } else {
            errorLog.innerText = "❌ 您的手機不支援 ARCore，請確認已安裝『Google Play Services for AR』";
          }
        } catch(err) {
          errorLog.innerText = "❌ 檢查 WebXR 錯誤: " + err.message;
        }
      } else {
        errorLog.innerText = "❌ 瀏覽器不支援 WebXR，請改用最新版 Google Chrome。";
      }
    }

    function onStartARClick() {
      document.getElementById('start-ar-btn').style.display = 'none';
      const errorLog = document.getElementById('error-log');

      setupThreeJS();

      navigator.xr.requestSession('immersive-ar', {
        requiredFeatures: ['hit-test']
      }).then((session) => {
        renderer.xr.setSession(session);
        animate();
      }).catch((err) => {
        document.getElementById('start-ar-btn').style.display = 'block';
        errorLog.innerText = "❌ 啟動 AR 失敗: " + err.message;
      });
    }

    function setupThreeJS() {
      scene = new THREE.Scene();
      camera = new THREE.PerspectiveCamera(70, window.innerWidth / window.innerHeight, 0.01, 20);

      const light = new THREE.HemisphereLight(0xffffff, 0xbbbbff, 1);
      light.position.set(0.5, 1, 0.25);
      scene.add(light);

      renderer = new THREE.WebGLRenderer({ 
        antialias: true, 
        alpha: true,
        premultipliedAlpha: false
      });
      renderer.setPixelRatio(window.devicePixelRatio);
      renderer.setSize(window.innerWidth, window.innerHeight);
      renderer.xr.enabled = true;
      document.body.appendChild(renderer.domElement);

      // 環形準星 (Reticle)
      const ringGeometry = new THREE.RingGeometry(0.08, 0.1, 32).rotateX(-Math.PI / 2);
      const ringMaterial = new THREE.MeshBasicMaterial({ color: 0x00ffcc, side: THREE.DoubleSide });
      reticle = new THREE.Mesh(ringGeometry, ringMaterial);
      reticle.matrixAutoUpdate = false;
      reticle.visible = false;
      scene.add(reticle);

      // 觸控點擊事件
      controller = renderer.xr.getController(0);
      controller.addEventListener('select', onSelect);
      scene.add(controller);

      document.getElementById('btn-reset').addEventListener('click', resetMeasurement);
    }

    function onSelect() {
      if (!reticle.visible) return;

      const currentPosition = new THREE.Vector3();
      currentPosition.setFromMatrixPosition(reticle.matrix);

      if (appState === 0) {
        startLinePoint = currentPosition.clone();
        createStartLine(startLinePoint);
        appState = 1;
        document.getElementById('status-text').innerText = "已設置【起跳線】！請點擊著地點";
        document.getElementById('btn-reset').style.display = 'block';

      } else if (appState === 1) {
        landingPoint = currentPosition.clone();
        
        const distanceInMeters = startLinePoint.distanceTo(landingPoint);
        const distanceInCm = (distanceInMeters * 100).toFixed(1);

        createLandingAndDistanceVisuals(startLinePoint, landingPoint);

        document.getElementById('result-box').style.display = 'block';
        document.getElementById('distance-display').innerText = `${distanceInCm} cm`;
        
        appState = 2;
        reticle.visible = false;
        document.getElementById('status-text').innerText = "量測完成！";
      }
    }

    function createStartLine(position) {
      const geometry = new THREE.BoxGeometry(2.0, 0.005, 0.05);
      const material = new THREE.MeshBasicMaterial({ color: 0xff0055 });
      startLineMesh = new THREE.Mesh(geometry, material);
      startLineMesh.position.copy(position);
      startLineMesh.rotation.y = camera.rotation.y;
      scene.add(startLineMesh);
    }

    function createLandingAndDistanceVisuals(p1, p2) {
      const landGeo = new THREE.BoxGeometry(1.5, 0.005, 0.03);
      const landMat = new THREE.MeshBasicMaterial({ color: 0xffcc00 });
      landingLineMesh = new THREE.Mesh(landGeo, landMat);
      landingLineMesh.position.copy(p2);
      landingLineMesh.rotation.y = startLineMesh.rotation.y;
      scene.add(landingLineMesh);

      const lineGeo = new THREE.BufferGeometry().setFromPoints([p1, p2]);
      const lineMat = new THREE.LineBasicMaterial({ color: 0x00ff88, linewidth: 3 });
      distanceLineMesh = new THREE.Line(lineGeo, lineMat);
      scene.add(distanceLineMesh);
    }

    function resetMeasurement(e) {
      if(e) e.stopPropagation();
      appState = 0;
      if (startLineMesh) scene.remove(startLineMesh);
      if (landingLineMesh) scene.remove(landingLineMesh);
      if (distanceLineMesh) scene.remove(distanceLineMesh);

      document.getElementById('result-box').style.display = 'none';
      document.getElementById('btn-reset').style.display = 'none';
      document.getElementById('status-text').innerText = "對準地面，點擊畫面設定【起跳線】";
    }

    function animate() {
      renderer.setAnimationLoop(render);
    }

    function render(timestamp, frame) {
      if (frame) {
        const referenceSpace = renderer.xr.getReferenceSpace();
        const session = renderer.xr.getSession();

        if (hitTestSourceRequested === false) {
          session.requestReferenceSpace('viewer').then((viewerSpace) => {
            session.requestHitTestSource({ space: viewerSpace }).then((source) => {
              hitTestSource = source;
            });
          });
          hitTestSourceRequested = true;
        }

        if (hitTestSource && appState < 2) {
          const hitTestResults = frame.getHitTestResults(hitTestSource);

          if (hitTestResults.length > 0) {
            const hit = hitTestResults[0];
            const pose = hit.getPose(referenceSpace);
            reticle.visible = true;
            reticle.matrix.fromArray(pose.transform.matrix);

            if (appState === 0) {
              document.getElementById('status-text').innerText = "已找到地面！點擊螢幕設置【起跳線】";
            }
          } else {
            reticle.visible = false;
            if (appState === 0) {
              document.getElementById('status-text').innerText = "正在掃描地面，請擺動鏡頭...";
            }
          }
        }
      }
      renderer.render(scene, camera);
    }
  </script>
</body>
</html>
