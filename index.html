<!DOCTYPE html>
<html lang="zh-HK">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>陸運會跳遠 AI 自動拍攝系統 (橫屏專用)</title>
  <style>
    * { box-sizing: border-box; }
    html, body {
      margin: 0; padding: 0;
      width: 100vw; height: 100vh;
      overflow: hidden; background-color: #000;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    }

    #video-feed {
      position: absolute; top: 0; left: 0;
      width: 100vw; height: 100vh;
      object-fit: cover; z-index: 1;
    }

    #draw-canvas {
      position: absolute; top: 0; left: 0;
      width: 100vw; height: 100vh;
      z-index: 2; pointer-events: none;
    }

    #ui-container {
      position: fixed; top: 0; left: 0;
      width: 100%; height: 100%;
      pointer-events: none; z-index: 10;
      display: flex; flex-direction: column;
      justify-content: space-between; padding: 15px 25px;
    }

    .interactive { pointer-events: auto; }

    #top-bar {
      display: flex; justify-content: space-between; align-items: center;
      background: rgba(0, 0, 0, 0.75); color: #fff;
      padding: 10px 20px; border-radius: 30px;
      backdrop-filter: blur(8px); border: 1px solid rgba(255,255,255,0.2);
    }

    #status-text { font-size: 16px; font-weight: bold; color: #00ffcc; }
    #ai-state { font-size: 14px; color: #ffcc00; }

    #action-btn-container {
      position: absolute; right: 30px; top: 50%;
      transform: translateY(-50%); display: flex; flex-direction: column; gap: 15px;
    }

    .btn {
      background: #00ffcc; color: #000;
      font-size: 18px; font-weight: 900;
      border: none; padding: 16px 36px; border-radius: 40px;
      cursor: pointer; box-shadow: 0 4px 20px rgba(0,255,204,0.5);
      transition: all 0.2s;
    }
    .btn:active { transform: scale(0.95); }
    .btn-again { background: #ffcc00; color: #000; display: none; }

    /* 結果照片 Modal */
    #photo-modal {
      display: none; position: fixed; top: 0; left: 0;
      width: 100vw; height: 100vh; background: rgba(0,0,0,0.92);
      z-index: 100; flex-direction: column; align-items: center; justify-content: center;
      padding: 15px;
    }

    #captured-image {
      max-width: 90%; max-height: 75vh;
      border: 3px solid #00ffcc; border-radius: 12px;
      box-shadow: 0 0 30px rgba(0,255,204,0.3);
    }
  </style>

  <!-- Google MediaPipe Pose 庫 -->
  <script src="https://cdn.jsdelivr.net/npm/@mediapipe/camera_utils/camera_utils.js" crossorigin="anonymous"></script>
  <script src="https://cdn.jsdelivr.net/npm/@mediapipe/pose/pose.js" crossorigin="anonymous"></script>
</head>
<body>

  <!-- 後置鏡頭 -->
  <video id="video-feed" playsinline muted></video>
  <!-- 繪圖圖層 -->
  <canvas id="draw-canvas"></canvas>

  <!-- UI 介面 -->
  <div id="ui-container">
    <div id="top-bar">
      <div>
        <span style="font-size: 12px; color: #aaa;">陸運會跳遠 AI 拍攝系統 (橫屏版)</span>
        <div id="status-text">請移動手機，將青綠色【垂直虛線】對準起跳線</div>
      </div>
      <div id="ai-state">系統初始化中...</div>
    </div>

    <div id="action-btn-container" class="interactive">
      <button id="btn-ready" class="btn">Ready</button>
      <button id="btn-again" class="btn btn-again">Again</button>
    </div>
  </div>

  <!-- 成果 Modal -->
  <div id="photo-modal">
    <h3 style="color: #00ffcc; margin: 0 0 10px 0;">📸 已記錄運動員跳遠著地照片！</h3>
    <img id="captured-image" src="" alt="跳遠紀錄">
    <button id="btn-modal-again" class="btn btn-again interactive" style="display: block; margin-top: 15px;">Again (測量下一位)</button>
  </div>

  <script>
    const videoElement = document.getElementById('video-feed');
    const canvasElement = document.getElementById('draw-canvas');
    const canvasCtx = canvasElement.getContext('2d');

    const btnReady = document.getElementById('btn-ready');
    const btnAgain = document.getElementById('btn-again');
    const btnModalAgain = document.getElementById('btn-modal-again');
    const statusText = document.getElementById('status-text');
    const aiState = document.getElementById('ai-state');

    // 狀態控制
    let isReady = false;
    let isCaptured = false;
    let startLineXRatio = 0.35; // 垂直虛線預設在橫屏畫面左側 35% 處

    // 人物動態追蹤變數
    let poseDetector = null;
    let lastFeetX = 0;
    let feetVelocity = 0;
    let personInAir = false;

    // 距離換算比例 (像素轉 cm)
    const CM_PER_PIXEL = 0.75;

    window.addEventListener('load', initApp);

    async function initApp() {
      canvasElement.width = window.innerWidth;
      canvasElement.height = window.innerHeight;

      // 1. 初始化人體骨架偵測模型
      poseDetector = new Pose({
        locateFile: (file) => `https://cdn.jsdelivr.net/npm/@mediapipe/pose/${file}`
      });

      poseDetector.setOptions({
        modelComplexity: 1,
        smoothLandmarks: true,
        minDetectionConfidence: 0.7, // 提高信心門檻，避免誤判非人體
        minTrackingConfidence: 0.7
      });

      poseDetector.onResults(onPoseResults);

      // 2. 開啟後置鏡頭
      try {
        const camera = new Camera(videoElement, {
          onFrame: async () => {
            if (isReady && !isCaptured) {
              await poseDetector.send({ image: videoElement });
            }
          },
          facingMode: 'environment',
          width: 1280,
          height: 720
        });
        await camera.start();
        aiState.innerText = "後置鏡頭已就緒";
      } catch (e) {
        aiState.innerText = "❌ 無法取得後鏡頭: " + e.message;
      }

      btnReady.addEventListener('click', handleReady);
      btnAgain.addEventListener('click', handleAgain);
      btnModalAgain.addEventListener('click', handleAgain);

      requestAnimationFrame(renderLoop);
    }

    // 點擊 "Ready" 鎖定起跳線
    function handleReady() {
      isReady = true;
      btnReady.style.display = 'none';
      btnAgain.style.display = 'block';

      statusText.innerText = "🔒 起跳線已鎖定！AI 正在監視運動員跳遠...";
      statusText.style.color = "#ff0055";
      aiState.innerText = "等待運動員登場...";
    }

    // 點擊 "Again" 重置
    function handleAgain() {
      isReady = false;
      isCaptured = false;
      personInAir = false;

      document.getElementById('photo-modal').style.display = 'none';
      btnReady.style.display = 'block';
      btnAgain.style.display = 'none';

      statusText.innerText = "請移動手機，將青綠色【垂直虛線】對準起跳線";
      statusText.style.color = "#00ffcc";
      aiState.innerText = "請按 Ready 鎖定起跳線";

      requestAnimationFrame(renderLoop);
    }

    // 畫面繪製循環：繪製垂直對準虛線/實線
    function renderLoop() {
      canvasCtx.clearRect(0, 0, canvasElement.width, canvasElement.height);

      const xPos = startLineXRatio * canvasElement.width;

      if (!isReady) {
        // 未 Ready：橫屏專用「垂直青綠虛線」
        canvasCtx.beginPath();
        canvasCtx.strokeStyle = "#00ffcc";
        canvasCtx.lineWidth = 5;
        canvasCtx.setLineDash([20, 12]); // 虛線風格
        canvasCtx.moveTo(xPos, 0);
        canvasCtx.lineTo(xPos, canvasElement.height);
        canvasCtx.stroke();
        canvasCtx.setLineDash([]);
      } else if (!isCaptured) {
        // 已 Ready：紅色實線鎖定
        canvasCtx.beginPath();
        canvasCtx.strokeStyle = "#ff0055";
        canvasCtx.lineWidth = 6;
        canvasCtx.moveTo(xPos, 0);
        canvasCtx.lineTo(xPos, canvasElement.height);
        canvasCtx.stroke();
      }

      if (!isCaptured) {
        requestAnimationFrame(renderLoop);
      }
    }

    // AI 人體辨識與著地觸發
    function onPoseResults(results) {
      if (!isReady || isCaptured) return;

      if (results.poseLandmarks) {
        const landmarks = results.poseLandmarks;

        // 核心修正：驗證是否為「真實人類」
        // 檢查 鼻子(0)、左眼(2)、右眼(5)、左腳跟(29)、右腳跟(30) 的可見度 (visibility)
        const nose = landmarks[0];
        const leftHeel = landmarks[29];
        const rightHeel = landmarks[30];

        const isHumanDetected = (nose.visibility > 0.6) && 
                                (leftHeel.visibility > 0.5 || rightHeel.visibility > 0.5);

        if (!isHumanDetected) {
          // 偵測到類似形狀但非人類（例如器材或背景物件），忽略不處理
          return;
        }

        aiState.innerText = "🏃 捕捉到運動員骨架！";

        // 取最靠近起跳線/後方的腳跟點（運動員向右跳）
        const heelX = Math.min(leftHeel.x, rightHeel.x);
        const heelY = leftHeel.x < rightHeel.x ? leftHeel.y : rightHeel.y;

        // 計算腳步水平速度
        feetVelocity = Math.abs(heelX - lastFeetX);
        lastFeetX = heelX;

        // 1. 判斷運動員腳步是否越過起跳線
        if (heelX > startLineXRatio) {
          personInAir = true;
          aiState.innerText = "🏃 運動員跳躍中...";
        }

        // 2. 自動拍照條件：是人類 + 曾越過起跳線 + 落地速度停頓
        if (personInAir && feetVelocity < 0.002 && !isCaptured) {
          isCaptured = true;
          captureAndAnnotatePhoto(heelX, heelY);
        }
      }
    }

    // 自動快門並繪製成績照片
    function captureAndAnnotatePhoto(landingX, landingY) {
      statusText.innerText = "📸 已自動拍攝落地瞬間！";
      aiState.innerText = "計算成績中...";

      const photoCanvas = document.createElement('canvas');
      photoCanvas.width = videoElement.videoWidth || 1280;
      photoCanvas.height = videoElement.videoHeight || 720;
      const pCtx = photoCanvas.getContext('2d');

      // 1. 畫底圖相片
      pCtx.drawImage(videoElement, 0, 0, photoCanvas.width, photoCanvas.height);

      const startX = startLineXRatio * photoCanvas.width;
      const landX = landingX * photoCanvas.width;
      const landY = landingY * photoCanvas.height;

      // 2. 計算距離
      const pixelDist = Math.abs(landX - startX);
      const distanceCm = (pixelDist * CM_PER_PIXEL).toFixed(1);

      // 3. 標註【紅色起跳線】
      pCtx.beginPath();
      pCtx.strokeStyle = "#ff0055";
      pCtx.lineWidth = 8;
      pCtx.moveTo(startX, 0);
      pCtx.lineTo(startX, photoCanvas.height);
      pCtx.stroke();

      // 4. 標註【黃色著地線】
      pCtx.beginPath();
      pCtx.strokeStyle = "#ffcc00";
      pCtx.lineWidth = 8;
      pCtx.moveTo(landX, 0);
      pCtx.lineTo(landX, photoCanvas.height);
      pCtx.stroke();

      // 5. 標註【綠色距離連接線】
      pCtx.beginPath();
      pCtx.strokeStyle = "#00ff88";
      pCtx.lineWidth = 6;
      pCtx.setLineDash([15, 10]);
      pCtx.moveTo(startX, landY);
      pCtx.lineTo(landX, landY);
      pCtx.stroke();

      // 6. 印出成績標註
      pCtx.fillStyle = "#00ff88";
      pCtx.font = "bold 50px sans-serif";
      pCtx.shadowColor = "black";
      pCtx.shadowBlur = 10;
      pCtx.fillText(`${distanceCm} cm`, (startX + landX) / 2 - 70, landY - 20);

      // 顯示照片
      document.getElementById('captured-image').src = photoCanvas.toDataURL('image/jpeg');
      document.getElementById('photo-modal').style.display = 'flex';
    }
  </script>
</body>
</html>
