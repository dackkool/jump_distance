<!DOCTYPE html>
<html lang="zh-HK">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>陸運會跳遠 WebXR AR + AI 自動測量系統</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body {
      width: 100vw; height: 100vh; overflow: hidden;
      background-color: #000; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    }

    #xr-overlay {
      position: fixed; top: 0; left: 0;
      width: 100vw; height: 100vh; z-index: 9999;
      display: flex; flex-direction: column;
      justify-content: space-between; align-items: center;
      padding: 25px 20px; pointer-events: none;
    }

    .interactive { pointer-events: auto; }

    #info-card {
      background: rgba(0, 0, 0, 0.85); color: #fff;
      padding: 14px 22px; border-radius: 20px;
      font-size: 15px; font-weight: bold; text-align: center;
      max-width: 90%; backdrop-filter: blur(8px);
      border: 1px solid rgba(255,255,255,0.2);
      box-shadow: 0 4px 15px rgba(0,0,0,0.5);
    }

    #controls {
      display: flex; gap: 12px; width: 100%;
      max-width: 400px; justify-content: center;
    }

    .btn {
      flex: 1; padding: 16px 10px; font-size: 16px; font-weight: 900;
      color: #fff; border: none; border-radius: 30px;
      box-shadow: 0 4px 15px rgba(0,0,0,0.5); cursor: pointer; text-align: center;
      transition: all 0.2s;
    }
    .btn:active { transform: scale(0.95); }

    #btn-start { background: #007bff; width: 100%; max-width: 220px; }
    #btn-set-start { background: #ff0055; display: none; }
    #btn-reset { background: #ffcc00; color: #000; display: none; }
    .btn:disabled { opacity: 0.4; cursor: not-allowed; }
  </style>

  <!-- Three.js 庫 -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
  <!-- MediaPipe Pose 庫 -->
  <script src="https://cdn.jsdelivr.net/npm/@mediapipe/camera_utils/camera_utils.js" crossorigin="anonymous"></script>
  <script src="https://cdn.jsdelivr.net/npm/@mediapipe/pose/pose.js" crossorigin="anonymous"></script>
</head>
<body>

  <!-- Hidden Video for MediaPipe Pose AI Analysis -->
  <video id="webcam-video" playsinline muted style="display:none;"></video>

  <!-- AR DOM Overlay -->
  <div id="xr-overlay">
    <div id="info-card" class="interactive">請點擊下方「開啟 AR 自動測量」按鈕</div>
    <div id="controls" class="interactive">
      <button id="btn-start" class="btn">開啟 AR 自動測量</button>
      <button id="btn-set-start" class="btn">標記起跳線</button>
      <button id="btn-reset" class="btn">重置 (測下一位)</button>
    </div>
  </div>

  <script>
    let camera, scene, renderer;
    let xrRefSpace, hitTestSource = null;
    let reticle;

    // AR 3D 位置數據
    let startLinePos = null;
    let landingPos = null;
    let groundPlane = null; // AR 地面 3D 平面

    // 3D Mesh 物件
    let startLineMesh = null;
    let landingMarkerMesh = null;
    let distLineMesh = null;
    let textSprite = null;

    // AI & 追蹤狀態
    let poseDetector = null;
    let isTrackingAI = false;
    let isCaptured = false;
    let personInAir = false;
    let lastFeetX = 0;

    const btnStart = document.getElementById('btn-start');
    const btnSetStart = document.getElementById('btn-set-start');
    const btnReset = document.getElementById('btn-reset');
    const infoCard = document.getElementById('info-card');
    const overlay = document.getElementById('xr-overlay');
    const videoElement = document.getElementById('webcam-video');

    // 環境與權限檢查
    window.addEventListener('DOMContentLoaded', () => {
      if (!window.isSecureContext) {
        infoCard.style.color = '#ff6b6b';
        infoCard.innerText = "❌ 錯誤：網頁必須在 HTTPS 環境下開啟！";
        btnStart.disabled = true;
      } else if (!navigator.xr) {
        infoCard.style.color = '#ff6b6b';
        infoCard.innerText = "❌ 錯誤：瀏覽器不支援 WebXR (請使用 Android Chrome)";
        btnStart.disabled = true;
      }
    });

    // 1. 初始化 WebXR 與 AI 模型
    btnStart.addEventListener('click', async () => {
      try {
        infoCard.innerText = "正在載入 AI 模型與相機權限...";

        // 初始化 MediaPipe AI
        poseDetector = new Pose({
          locateFile: (file) => `https://cdn.jsdelivr.net/npm/@mediapipe/pose/${file}`
        });
        poseDetector.setOptions({
          modelComplexity: 1,
          smoothLandmarks: true,
          minDetectionConfidence: 0.6,
          minTrackingConfidence: 0.6
        });
        poseDetector.onResults(onPoseDetected);

        // 啟動 Three.js & WebXR
        scene = new THREE.Scene();
        camera = new THREE.PerspectiveCamera(70, window.innerWidth / window.innerHeight, 0.01, 20);

        renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.setPixelRatio(window.devicePixelRatio);
        renderer.xr.enabled = true;
        document.body.appendChild(renderer.domElement);

        const light = new THREE.HemisphereLight(0xffffff, 0xbbbbff, 1);
        scene.add(light);

        // 地面準心 (綠環)
        const ringGeo = new THREE.RingGeometry(0.04, 0.05, 32).rotateX(-Math.PI / 2);
        const ringMat = new THREE.MeshBasicMaterial({ color: 0x00ff00 });
        reticle = new THREE.Mesh(ringGeo, ringMat);
        reticle.matrixAutoUpdate = false;
        reticle.visible = false;
        scene.add(reticle);

        const session = await navigator.xr.requestSession('immersive-ar', {
          requiredFeatures: ['hit-test', 'local-floor'],
          optionalFeatures: ['dom-overlay'],
          domOverlay: { root: overlay }
        });

        renderer.xr.setSession(session);

        btnStart.style.display = 'none';
        btnSetStart.style.display = 'block';
        infoCard.innerText = "掃描地面，瞄準【起跳線】按下「標記起跳線」";

        const viewerSpace = await session.requestReferenceSpace('viewer');
        hitTestSource = await session.requestHitTestSource({ space: viewerSpace });
        xrRefSpace = await session.requestReferenceSpace('local-floor');

        renderer.setAnimationLoop(renderLoop);

      } catch (err) {
        infoCard.innerText = "啟動失敗: " + err.message;
      }
    });

    // 2. 鎖定 3D 起跳線與地面方程式
    btnSetStart.addEventListener('click', () => {
      if (reticle && reticle.visible) {
        startLinePos = new THREE.Vector3().setFromMatrixPosition(reticle.matrix);

        // 建立 3D 地面 Plane，用於把 2D 腳跟影像是 Raycast 到 3D 地面上
        groundPlane = new THREE.Plane(new THREE.Vector3(0, 1, 0), -startLinePos.y);

        // 建立 3D 起跳線 Mesh (紅條)
        const lineGeo = new THREE.BoxGeometry(3.0, 0.01, 0.05);
        const lineMat = new THREE.MeshBasicMaterial({ color: 0xff0055 });
        startLineMesh = new THREE.Mesh(lineGeo, lineMat);
        startLineMesh.position.copy(startLinePos);
        scene.add(startLineMesh);

        btnSetStart.style.display = 'none';
        isTrackingAI = true;

        infoCard.innerText = "🔒 起跳線已鎖定！AI 監控中，請運動員起跳...";
        infoCard.style.color = "#ffcc00";
      } else {
        alert("尚未鎖定地面！請先移動手機對準地面。");
      }
    });

    // 3. AR 主循環渲染 + 發送 AI 檢測
    function renderLoop(timestamp, frame) {
      if (frame) {
        const hitTestResults = frame.getHitTestResults(hitTestSource);
        if (hitTestResults.length > 0) {
          const hit = hitTestResults[0];
          const pose = hit.getPose(xrRefSpace);
          reticle.visible = true;
          reticle.matrix.fromArray(pose.transform.matrix);
        } else {
          reticle.visible = false;
        }

        // 當起跳線已鎖定且尚未捕捉結果時，提取 WebGL 畫面送給 AI
        if (isTrackingAI && !isCaptured && renderer.domElement) {
          poseDetector.send({ image: renderer.domElement });
        }
      }
      renderer.render(scene, camera);
    }

    // 4. AI 骨架分析與「自動著地判定」
    function onPoseDetected(results) {
      if (!isTrackingAI || isCaptured || !results.poseLandmarks) return;

      const landmarks = results.poseLandmarks;
      const leftHeel = landmarks[29];
      const rightHeel = landmarks[30];

      if (leftHeel.visibility < 0.5 && rightHeel.visibility < 0.5) return;

      // 取得畫面中較靠後/主要的腳跟 2D 螢幕座標 (歸一化 -1 到 1)
      const heel2D = leftHeel.x < rightHeel.x ? leftHeel : rightHeel;
      const ndcX = (heel2D.x * 2) - 1;
      const ndcY = -(heel2D.y * 2) + 1;

      // 計算速度 (位移)
      const velocity = Math.abs(ndcX - lastFeetX);
      lastFeetX = ndcX;

      // 判斷運動員進入起跳區域
      if (!personInAir && heel2D.y > 0.4) {
        personInAir = true;
        infoCard.innerText = "🏃 運動員跳躍中...";
      }

      // 當人已跳起，且腳跟畫面移動速度低於臨界值 (代表著地停頓瞬間)
      if (personInAir && velocity < 0.003) {
        isCaptured = true;
        autoMeasureLanding(ndcX, ndcY);
      }
    }

    // 5. 自動計算 3D 著地位置與距離
    function autoMeasureLanding(ndcX, ndcY) {
      // 透過 Raycaster 從相機位置穿過腳跟 2D 畫面打向 3D 地面
      const raycaster = new THREE.Raycaster();
      raycaster.setFromCamera(new THREE.Vector2(ndcX, ndcY), camera);

      landingPos = new THREE.Vector3();
      raycaster.ray.intersectPlane(groundPlane, landingPos);

      if (!landingPos) {
        landingPos = new THREE.Vector3().setFromMatrixPosition(reticle.matrix);
      }

      // 建立黃色著地點 3D 圓盤
      const cylinderGeo = new THREE.CylinderGeometry(0.08, 0.08, 0.02, 32);
      const cylinderMat = new THREE.MeshBasicMaterial({ color: 0xffcc00 });
      landingMarkerMesh = new THREE.Mesh(cylinderGeo, cylinderMat);
      landingMarkerMesh.position.copy(landingPos);
      scene.add(landingMarkerMesh);

      // 真實 3D 距離 (m -> cm)
      const distMeters = startLinePos.distanceTo(landingPos);
      const distCm = (distMeters * 100).toFixed(1);

      // 繪製 3D 綠色測量連線
      const points = [startLinePos, landingPos];
      const lineGeo = new THREE.BufferGeometry().setFromPoints(points);
      const lineMat = new THREE.LineBasicMaterial({ color: 0x00ff88, linewidth: 6 });
      distLineMesh = new THREE.Line(lineGeo, lineMat);
      scene.add(distLineMesh);

      // 建立 3D 空間數字看板
      textSprite = createTextSprite(`${distCm} cm`);
      textSprite.position.set(
        (startLinePos.x + landingPos.x) / 2,
        startLinePos.y + 0.25,
        (startLinePos.z + landingPos.z) / 2
      );
      scene.add(textSprite);

      btnReset.style.display = 'block';
      infoCard.innerText = `🎯 捕捉成功！跳遠成績：${distCm} cm (${distMeters.toFixed(2)} m)`;
      infoCard.style.color = '#00ff88';
    }

    // 6. 重置測量
    btnReset.addEventListener('click', () => {
      if (startLineMesh) scene.remove(startLineMesh);
      if (landingMarkerMesh) scene.remove(landingMarkerMesh);
      if (distLineMesh) scene.remove(distLineMesh);
      if (textSprite) scene.remove(textSprite);

      startLinePos = null;
      landingPos = null;
      isTrackingAI = false;
      isCaptured = false;
      personInAir = false;

      btnReset.style.display = 'none';
      btnSetStart.style.display = 'block';
      infoCard.style.color = '#ffffff';
      infoCard.innerText = "已重置。請瞄準【起跳線】按下「標記起跳線」";
    });

    // 建立 3D 看板文字圖層
    function createTextSprite(text) {
      const canvas = document.createElement('canvas');
      canvas.width = 512; canvas.height = 256;
      const ctx = canvas.getContext('2d');

      ctx.fillStyle = "rgba(0, 0, 0, 0.85)";
      ctx.roundRect(40, 40, 432, 176, 30);
      ctx.fill();

      ctx.strokeStyle = "#00ff88";
      ctx.lineWidth = 8;
      ctx.stroke();

      ctx.font = "Bold 72px sans-serif";
      ctx.fillStyle = "#00ff88";
      ctx.textAlign = "center";
      ctx.textBaseline = "middle";
      ctx.fillText(text, 256, 128);

      const texture = new THREE.CanvasTexture(canvas);
      const spriteMaterial = new THREE.SpriteMaterial({ map: texture });
      const sprite = new THREE.Sprite(spriteMaterial);
      sprite.scale.set(0.7, 0.35, 1.0);
      return sprite;
    }
  </script>
</body>
</html>
